<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses · Invoice Manager</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12306b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/documents.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>

  <main class="page">
    <div class="page-head">
      <h1>Expenses</h1>
      <div class="grow"><button type="button" class="primary" id="addBtn">Add expense</button></div>
    </div>
    <div class="toolbar" style="margin-top:0">
      <label style="margin:0">Period <select id="exPeriod"></select></label>
      <select id="exCat" aria-label="Category"></select>
      <input type="search" id="exSearch" placeholder="Search vendor or description" aria-label="Search">
      <span class="hint" id="exSummary" style="margin:0"></span>
    </div>
    <div class="msg" id="exStatus" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Date</th><th>Paid to</th><th>Category</th><th class="num">Amount</th><th>Receipt</th><th>Actions</th></tr></thead>
        <tbody id="exBody"></tbody>
      </table>
    </div>
  </main>

  <dialog id="exDialog">
    <form class="dlg" id="exForm" novalidate>
      <h3 id="exTitle">Add expense</h3>
      <div class="info">Upload the receipt and the details are read for you. Check them before saving.</div>
      <div class="rc-drop">
        <div class="row">
          <label class="btn" style="margin:0;color:var(--ink)">Choose receipt photo or PDF
            <input id="fFile" type="file" accept="image/*,application/pdf" hidden>
          </label>
          <label class="check" style="margin:0"><input type="checkbox" id="fScan" checked> Read it for me</label>
        </div>
        <div class="rc-note" id="rcNote"></div>
        <div id="rcCurrent" hidden class="hint" style="margin-top:6px">Receipt: <b id="rcCurrentName"></b> · <button type="button" class="linkbtn" id="rcView">View</button> <button type="button" class="linkbtn" id="rcRemove">Remove</button></div>
      </div>
      <label class="req">Paid to (vendor) <input id="fVendor" type="text" maxlength="120" autocomplete="off"></label>
      <div class="two">
        <label class="req">Date <input id="fDate" type="date"></label>
        <label class="req">Amount paid <input id="fAmount" type="number" step="0.01" min="0" inputmode="decimal"></label>
      </div>
      <div class="two">
        <label>Of which tax / VAT <input id="fTax" type="number" step="0.01" min="0" inputmode="decimal"></label>
        <label>Category <input id="fCat" type="text" list="catList" maxlength="60" autocomplete="off"><datalist id="catList"></datalist></label>
      </div>
      <div class="two">
        <label>Paid by <select id="fMethod"></select></label>
        <label>Repeats <select id="fRepeat"><option>None</option><option>Weekly</option><option>Monthly</option><option>Quarterly</option><option>Yearly</option></select></label>
      </div>
      <label>Reference (receipt or invoice number) <input id="fRef" type="text" maxlength="60"></label>
      <label>Notes <input id="fDesc" type="text" maxlength="400"></label>
      <div class="hint">Mark rent, salaries and other regular costs as repeating so projections include them every period.</div>
      <div class="err" id="exError" role="alert"></div>
      <div class="btns"><button type="button" id="exCancel">Cancel</button><button type="submit" class="primary" id="exSave">Save expense</button></div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/image.js"></script>
  <script src="js/accounting.js"></script>
  <script src="js/pages/expenses.js"></script>
</body>
</html>
