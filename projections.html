<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>

  <main class="page">
    <div class="page-head">
      <h1>Projections</h1>
      <div class="grow"><label style="margin:0">Look ahead <select id="pjMonths"><option value="3">3 months</option><option value="6" selected>6 months</option><option value="12">12 months</option></select></label></div>
    </div>
    <div class="msg" id="pjStatus" role="status"></div>
    <div class="empty-state" id="pjEmpty" hidden></div>
    <div id="pjBody" hidden>
      <div class="cards" id="pjCards"></div>
      <div class="charts">
        <div class="chartcard"><h3>Expected income, expenses and profit</h3><div class="cap">Month by month, based on your history.</div><div class="cv"><canvas id="chProfit"></canvas></div></div>
        <div class="chartcard"><h3>Cash balance</h3><div class="cap">Expected, with best and worst case.</div><div class="cv"><canvas id="chCash"></canvas></div></div>
      </div>
      <div class="chartcard" style="margin-top:12px"><h3>Month by month</h3>
        <div class="tablewrap" style="border:none"><table class="inv"><thead><tr><th>Month</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Profit</th><th class="num">Profit range</th><th class="num">Cash</th></tr></thead><tbody id="pjRows"></tbody></table></div></div>
      <div class="chartcard" style="margin-top:12px"><h3>How this is worked out</h3><ul class="assump" id="pjAssump"></ul></div>
    </div>
  </main>
  </div>
</div>
