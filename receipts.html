  <meta charset="UTF-8">

  <title>Receipts · Invoice Manager</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12306b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoices">

<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>

  <main class="page">
    <div class="page-head"><h1>Payments in</h1><div class="grow"><a class="btn" href="invoices.html?f=outstanding">Record a payment</a></div></div>
    <div class="cards c3">
      <div class="card"><div class="k">Receipts issued</div><div class="v" id="rCount">0</div><div class="s" id="rCountS"></div></div>
      <div class="card green"><div class="k">Total received</div><div class="v" id="rTotal">0.00</div><div class="s" id="rTotalS"></div></div>
      <div class="card"><div class="k">Received this month</div><div class="v" id="rMonth">0.00</div><div class="s" id="rMonthS"></div></div>
    </div>
    <div class="toolbar">
      <input id="rSearch" type="search" placeholder="Search receipt, invoice or customer">
      <div class="viewtoggle grow" id="viewToggle"><button type="button" data-view="grid" title="Grid view" aria-label="Grid view">GRID</button><button type="button" data-view="list" title="List view" aria-label="List view">LIST</button></div>
      <button type="button" id="reloadBtn">Refresh</button>
    </div>
    <div class="msg" id="receiptsStatus" role="status"></div>
    <div class="docgrid" id="gridView"></div>
    <div class="tablewrap" id="tableView" hidden>
      <table class="inv">
        <thead><tr>
          <th>Receipt</th><th>Invoice</th><th>Customer</th>
          <th class="num">Amount</th><th class="num">Balance after</th><th>Method</th><th>Actions</th>
        </tr></thead>
        <tbody id="rcBody"></tbody>
      </table>
    </div>
  </main>
  </div>
</div>

  <script src="js/pwa.js"></script>

  <script src="js/signature.js"></script>
