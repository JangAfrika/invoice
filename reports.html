  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Invoice Manager</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12306b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/documents.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>

  <main class="page">
    <div class="page-head">
      <h1>Reports</h1>
      <div class="grow no-print"><button type="button" id="csvPl">Export profit and loss</button><button type="button" id="csvTx">Export transactions</button><button type="button" class="primary" id="printBtn">Print</button></div>
    </div>
    <div class="toolbar" style="margin-top:0"><label style="margin:0">Period <select id="repPeriod"></select></label></div>
    <div class="msg" id="repStatus" role="status"></div>

    <div class="acc-split">
      <div class="chartcard"><h3 id="repTitle">Profit and loss</h3><div class="cap" id="plNote"></div>
        <table class="pl"><tbody id="plBody"></tbody></table></div>
      <div class="chartcard"><h3>Month by month</h3><div class="cap">Cash basis.</div>
        <div class="tablewrap" style="border:none"><table class="inv"><thead><tr><th>Month</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Profit</th></tr></thead><tbody id="moBody"></tbody></table></div></div>
    </div>

    <h2 style="font-size:14px;margin:20px 0 6px">All transactions</h2>
    <div class="toolbar" style="margin-top:0">
      <div class="chips no-print" id="txKind"><button type="button" class="active" data-k="all">All</button><button type="button" data-k="in">Money in</button><button type="button" data-k="out">Money out</button></div>
      <input type="search" id="txSearch" placeholder="Search" aria-label="Search transactions">
      <span class="hint" id="txSummary" style="margin:0"></span>
    </div>
    <div class="tablewrap">
      <table class="inv"><thead><tr><th>Date</th><th>Type</th><th>Who</th><th>Category</th><th class="num">Amount</th></tr></thead><tbody id="txBody"></tbody></table>
    </div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/image.js"></script>
  <script src="js/accounting.js"></script>
  <script src="js/pages/reports.js"></script>
</body>
</html>
