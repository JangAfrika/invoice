  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers · Invoice Manager</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12306b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>

  <main class="page">
    <div class="page-head">
      <h1>Customers</h1>
      <div class="grow"><button type="button" class="primary" id="addBtn">Add customer</button></div>
    </div>
    <div class="toolbar" style="margin-top:0">
      <input id="search" type="search" placeholder="Search name, phone or email">
      <label class="check" style="margin:0"><input type="checkbox" id="showArchived"> Show archived</label>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="custStatus" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr>
          <th>Customer</th><th>Contact</th><th class="num">Invoices</th>
          <th class="num">Invoiced</th><th class="num">Paid</th><th class="num">Owes</th><th>Actions</th>
        </tr></thead>
        <tbody id="custBody"></tbody>
      </table>
    </div>
  </main>

  <dialog id="custDialog">
    <form class="dlg" id="custForm" novalidate>
      <h3 id="custTitle">Add customer</h3>
      <div class="info">Contact details are printed under "Bill to" on new invoices.</div>
      <label class="req">Name <input id="cName" type="text" maxlength="120" required></label>
      <div class="two">
        <label>Phone <input id="cPhone" type="tel" maxlength="60"></label>
        <label>Email <input id="cEmail" type="email" maxlength="120"></label>
      </div>
      <label>Address <input id="cAddress" type="text" maxlength="200"></label>
      <label>Notes (not printed) <textarea id="cNotes" rows="2" maxlength="500"></textarea></label>
      <label class="check" id="cActiveWrap" hidden><input type="checkbox" id="cActive" checked> Active (shown when creating invoices)</label>
      <div class="err" id="custError"></div>
      <div class="btns">
        <button type="button" id="custCancel">Cancel</button>
        <button type="submit" class="primary" id="custSave">Save</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/pages/customers.js"></script>
</body>
</html>
