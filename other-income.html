  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Other income · Invoice Manager</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12306b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/documents.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>

  <main class="page">
    <div class="page-head">
      <h1>Other income</h1>
      <div class="grow"><button type="button" class="primary" id="addBtn">Add income</button></div>
    </div>
    <div class="hint" style="margin:0 0 12px">Money paid on your invoices is counted automatically. Record anything else you received here, such as cash sales, interest or grants.</div>
    <div class="toolbar" style="margin-top:0">
      <label style="margin:0">Period <select id="inPeriod"></select></label>
      <input type="search" id="inSearch" placeholder="Search source or description" aria-label="Search">
      <span class="hint" id="inSummary" style="margin:0"></span>
    </div>
    <div class="msg" id="inStatus" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Date</th><th>Received from</th><th>Category</th><th class="num">Amount</th><th>Method</th><th>Actions</th></tr></thead>
        <tbody id="inBody"></tbody>
      </table>
    </div>
  </main>

  <dialog id="inDialog">
    <form class="dlg" id="inForm" novalidate>
      <h3 id="inTitle">Add income</h3>
      <label class="req">Received from <input id="iSource" type="text" maxlength="120" autocomplete="off"></label>
      <div class="two">
        <label class="req">Date <input id="iDate" type="date"></label>
        <label class="req">Amount received <input id="iAmount" type="number" step="0.01" min="0" inputmode="decimal"></label>
      </div>
      <div class="two">
        <label>Category <input id="iCat" type="text" list="iCatList" maxlength="60" autocomplete="off"><datalist id="iCatList"></datalist></label>
        <label>Received by <select id="iMethod"></select></label>
      </div>
      <label>Reference <input id="iRef" type="text" maxlength="60"></label>
      <label>Notes <input id="iDesc" type="text" maxlength="400"></label>
      <div class="err" id="inError" role="alert"></div>
      <div class="btns"><button type="button" id="inCancel">Cancel</button><button type="submit" class="primary" id="inSave">Save income</button></div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/image.js"></script>
  <script src="js/accounting.js"></script>
  <script src="js/pages/other-income.js"></script>
</body>
</html>
